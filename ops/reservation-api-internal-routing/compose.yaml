name: reservation-api-internal-routing
services:
  appwrite-internal-proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: appwrite-internal-proxy
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      runtimes:
        aliases: [appwrite-internal-proxy]
      appwrite: {}
    labels:
      traefik.enable: "false"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
networks:
  runtimes:
    external: true
    name: runtimes
  appwrite:
    external: true
    name: appwrite
