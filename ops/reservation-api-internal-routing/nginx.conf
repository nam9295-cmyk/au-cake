user nginx;
worker_processes 1;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    # Refresh Docker DNS after a future Appwrite core container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    server {
        listen 80;
        client_max_body_size 20m;
        location = /healthz { return 200 'ok\n'; }
        location /v1/ {
            set $appwrite_upstream appwrite;
            proxy_pass http://$appwrite_upstream$request_uri;
            proxy_http_version 1.1;
            # Appwrite 1.8.1 accepts this internal Host without HTTPS redirect.
            proxy_set_header Host appwrite;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_next_upstream off;
            proxy_cache off;
            proxy_store off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect off;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        location / { return 404; }
    }
}
